<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradeo — GCSE Study (Global)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23ff7a1a'/%3E%3Ctext x='32' y='33' text-anchor='middle' dominant-baseline='central' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='40' fill='%230f1b3d'%3EG%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1b3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b3d;--bg:#f2f4fa;--card:#fff;--line:#0f1b3d;--blue:#2b50ff;--org:#ff7a1a;--mint:#17c3a0;--muted:#5d6785;--sh:#0f1b3d;--soft:#e8ecff}
body.dark{--ink:#eef1ff;--bg:#0b1020;--card:#141b33;--line:#3a4570;--muted:#9aa5cc;--sh:#2b50ff;--soft:#1d2748}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3,.stat,.timer,.logo{font-family:'Bricolage Grotesque','Plus Jakarta Sans',Arial,sans-serif;letter-spacing:-.02em}
h2,h3{margin:0 0 8px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0f1b3d;color:#c9d1f5;padding:22px 16px;position:fixed;top:0;bottom:0;left:0;overflow:auto}
.dark .sidebar{background:#070b17;border-right:1px solid #1d2748}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin:0 6px 30px;color:#fff}
.logo em{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--org);color:#0f1b3d;font-size:20px;transform:rotate(-6deg)}
.logo span{color:var(--org)}
.nav button{width:100%;padding:12px 14px;text-align:left;background:transparent;border-radius:12px;margin-bottom:4px;color:inherit;font-weight:500;transition:background .15s}
.nav button:hover{background:#1c2a58;color:#fff}
.nav button.active{background:var(--blue);color:#fff;font-weight:700}
.nav .ic{display:inline-block;width:30px}
.main{margin-left:250px;width:calc(100% - 250px);padding:32px 36px;max-width:1200px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.topbar h2{font-size:30px;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:4px 4px 0 var(--sh)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px}
.grid .card{margin-bottom:0}
.subject{padding:18px;border-radius:18px;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c,var(--blue));cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:3px 3px 0 var(--sh)}
.subject:hover{transform:translate(-2px,-3px);box-shadow:6px 7px 0 var(--sh)}
.subject h3{font-size:18px;margin:10px 0 8px}
.ico{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;font-size:26px;background:color-mix(in srgb,var(--c,var(--blue)) 18%,transparent);margin-bottom:6px}
.ico.lg{width:72px;height:72px;font-size:38px;border-radius:20px}
.btn{background:var(--blue);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;border:2px solid var(--line);box-shadow:3px 3px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn.secondary{background:var(--soft);color:var(--ink)}
.btn.danger{background:#e5484d}
input,textarea,select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:0}
textarea{resize:vertical}
.hero{position:relative;overflow:hidden;padding:36px;background:var(--blue);color:#fff;border-radius:24px;margin-bottom:22px;border:2px solid var(--line);box-shadow:6px 6px 0 var(--sh)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:210px;height:210px;border-radius:50%;background:var(--org);border:2px solid #0f1b3d}
.hero h1{position:relative;z-index:1;margin:0 0 10px;font-size:40px;line-height:1.1;max-width:560px}
.hero p{position:relative;z-index:1;max-width:480px;margin:0 0 18px;font-size:17px}
.hero .btn{position:relative;z-index:1;background:#fff;color:#0f1b3d;border-color:#0f1b3d;box-shadow:3px 3px 0 #0f1b3d}
.stat{font-size:36px;font-weight:800}
.stats .card:nth-child(1){background:#ffe9d6;color:#0f1b3d}
.stats .card:nth-child(2){background:#d6f6ee;color:#0f1b3d}
.stats .card:nth-child(3){background:#e0e6ff;color:#0f1b3d}
.stats .card .small{color:#4a5473}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.quiz-question{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;margin-bottom:16px}
.option{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-weight:500;transition:transform .1s}
.option:hover:not(:disabled){background:var(--soft);transform:translateX(4px)}
.option.right{background:#c9f5dc;border-color:#13894a;color:#0c3a21}
.option.wrong{background:#ffd9d9;border-color:#d03a3f;color:#4a1416}
.timer{font-size:76px;font-weight:800;text-align:center;margin:24px;font-variant-numeric:tabular-nums}
.struggle{border-color:var(--org,#ff7a1a)}
.help{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.help:last-child{border:0}
.lnks{display:flex;gap:8px;flex-wrap:wrap}
.lnk{display:inline-block;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.lnk.yt{background:#ff0033;color:#fff}
.bar{height:14px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chips.sm{margin-bottom:12px}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.chip b{opacity:.6;margin-left:4px}
.chip.on{background:var(--blue);color:#fff}
.chip.add{border-style:dashed;background:transparent}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.task:last-child{border:0}
.tick{flex-shrink:0;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--card);color:#fff;font-weight:800;font-size:18px;line-height:1;display:grid;place-items:center}
.task.done .tick{background:var(--mint)}
.task.done .ttl{text-decoration:line-through;opacity:.55}
.tmain{flex:1;min-width:0}
.ttl{font-weight:700;word-break:break-word}
.tmeta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.due.over{color:#e5484d;font-weight:700}
.due.soon{color:var(--org);font-weight:700}
.x{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:transparent;color:var(--muted);font-size:16px}
.x:hover{color:#e5484d}
.empty{text-align:center}
.empty .big{font-size:40px}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--soft);border:1.5px solid var(--line);margin:3px 3px 3px 0;font-size:13px;font-weight:500}
.award{display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.award:last-child{border:0}
.award.locked{opacity:.4;filter:grayscale(1)}
.award .big{display:grid;place-items:center;width:52px;height:52px;font-size:28px;border-radius:14px;background:#ffe9d6;border:2px solid #0f1b3d}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.tip{padding:12px 0;border-bottom:2px dashed var(--line)}
.tip:last-child{border:0}
.tip b{display:block}
@media(max-width:850px){
.sidebar{width:70px;padding:14px 8px}
.logo{justify-content:center;margin:0 0 24px}
.logo b{display:none}
.nav button{text-align:center;padding:12px 0}
.nav .t{display:none}
.nav .ic{width:auto;font-size:20px}
.main{margin-left:70px;width:calc(100% - 70px);padding:20px 16px}
.grid{grid-template-columns:1fr}
.hero{padding:26px}
.hero h1{font-size:30px}
.hero::after{width:130px;height:130px;right:-40px;top:-40px}
.timer{font-size:60px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.explain{margin-top:14px;padding:14px 16px;border-radius:14px;border:2px solid;color:#0f1b3d}
.explain p{margin:6px 0}
.explain.good{background:#e6f9ee;border-color:#13894a}
.explain.bad{background:#fff1e6;border-color:#d97706}
.explain .small{color:#3b4468}
.avs{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);font-size:24px;font-weight:800;flex-shrink:0}
.avs.big{width:72px;height:72px;font-size:38px}
.avgrid{display:flex;flex-wrap:wrap;gap:8px}
.avopt{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;display:grid;place-items:center}
.avopt.txt{font-size:16px;font-weight:800}
.avopt.on,.swatch.on{outline:3px solid var(--blue);outline-offset:2px}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.lbrow{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:2px dashed var(--line);border-radius:12px}
.lbrow:last-child{border-bottom:0}
.lbrow.me{background:var(--soft)}
.rank{width:34px;text-align:center;font-weight:800;font-size:20px;flex-shrink:0}
.lbxp{font-weight:800;white-space:nowrap}
.flash{display:block;width:100%;min-height:170px;margin-top:12px;padding:24px;border:2px solid var(--line);border-radius:18px;background:var(--soft);color:var(--ink);font-size:22px;font-weight:700;text-align:center;font-family:inherit}
.flash small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.flash.back{background:#c9f5dc;color:#0c3a21}
.flash.back small{color:#3b6b52}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tbtn{padding:12px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;display:grid;gap:2px;place-items:center}
.tbtn small{font-size:11px;font-weight:600;opacity:.7}
.tbtn.done{background:#c9f5dc;color:#0c3a21}
.tbtn.next{background:var(--blue);color:#fff}
.tbtn.lock{opacity:.5;cursor:not-allowed}
.card.cur{border-color:var(--blue)}
.pip{position:fixed;right:12px;bottom:12px;z-index:20;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:24px;box-shadow:2px 2px 0 var(--sh);opacity:.9}
.pipb{position:fixed;right:12px;bottom:64px;z-index:20;max-width:240px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;box-shadow:2px 2px 0 var(--sh)}
.hidden{display:none!important}
.auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.authcard{width:min(420px,100%);margin:0}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:700;border:2px solid var(--line)}
.tabs button.on{background:var(--blue);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;cursor:pointer}
.chk input{width:auto}
.authcard a{color:var(--blue);font-weight:700}
.authcard .btn{margin-top:4px}
.av{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--org);color:#0f1b3d;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;border:2px solid var(--line);cursor:pointer;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.lgav{width:84px;height:84px;font-size:34px;cursor:default}
.toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:#0f1b3d;color:#fff;padding:12px 18px;border-radius:12px;border:2px solid #ff7a1a;max-width:90%}

/* ===== CREATOR / SEASONAL ===== */
#evfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#evfx .crow{position:absolute;left:0;width:var(--w,56px);animation:crowfly var(--d,9s) linear var(--dl,0s) both;will-change:transform;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
#evfx .crow.rev{animation-name:crowflyR}
#evfx .crow svg{width:100%;height:auto;display:block;fill:#120d1c}
#evfx .crow.rev svg{transform:scaleX(-1)}
#evfx .crow .eye{fill:#fff}
body.dark #evfx .crow svg{fill:#a79bd0}body.dark #evfx .crow .eye{fill:#0b1020}
#evfx .crow .wing{transform-box:view-box;transform-origin:28px 21px;animation:flap .32s ease-in-out var(--fd,0s) infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.75)}}
@keyframes crowfly{from{transform:translate(-160px,0)}50%{transform:translate(50vw,-26px)}to{transform:translate(110vw,8px)}}
@keyframes crowflyR{from{transform:translate(110vw,0)}50%{transform:translate(50vw,-26px)}to{transform:translate(-160px,8px)}}
#evfx span{position:absolute;top:-40px;opacity:0;animation:evfall 4s linear forwards}
@keyframes evfall{10%{opacity:.9}80%{opacity:.9}to{transform:translateY(112vh) rotate(360deg);opacity:0}}
.qotd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}.qotd input{flex:1;min-width:140px;padding:8px 10px}
.statbox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statbox div{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}.statbox b{display:block;font-size:22px}
@media (prefers-reduced-motion:reduce){#evfx{display:none}}
#banner .bn{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--soft);margin-bottom:14px;font-weight:700}
#banner .bn.ev{background:var(--org);color:#0f1b3d}
#banner .bn.boost{background:#ffd23f;color:#0f1b3d}
.crown{color:#ffd23f}
.adm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.adm-row:last-child{border:0}
.adm-row .grow{flex:1;min-width:140px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--sh)}
.banned-tag{background:#e5484d;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
body.ev-christmas{--blue:#c62828;--org:#2e7d32;--mint:#d4a017;--soft:#ffe3e3}
body.ev-christmas:not(.dark){--bg:#fff5f5}
body.ev-halloween{--blue:#6a1b9a;--org:#ff6d00;--mint:#7cb342;--soft:#f1e1ff}
body.ev-halloween:not(.dark){--bg:#fff4e8}
body.ev-summer{--blue:#0288d1;--org:#ffb300;--mint:#00bfa5;--soft:#dff3ff}
body.ev-summer:not(.dark){--bg:#fffbea}
body.ev-easter{--blue:#8e6fd8;--org:#ff8fab;--mint:#7bdcb5;--soft:#f3e8ff}
body.ev-easter:not(.dark){--bg:#fdf6ff}
body.ev-valentine{--blue:#d81b60;--org:#ff6f91;--mint:#ff9ec0;--soft:#ffe0ec}
body.ev-valentine:not(.dark){--bg:#fff0f5}
body.ev-newyear{--blue:#1a237e;--org:#ffc400;--mint:#00e5ff;--soft:#e0e3ff}
body.ev-exams{--blue:#0d47a1;--org:#ef6c00;--mint:#00897b;--soft:#e3edff}
body[class*="ev-"] .sidebar{background:var(--side,#0f1b3d)}
body.ev-christmas{--side:#4a0f12}body.ev-halloween{--side:#1b0d2a}body.ev-summer{--side:#01579b}
body.ev-easter{--side:#4a3a7a}body.ev-valentine{--side:#5a1030}body.ev-newyear{--side:#0a0e33}body.ev-exams{--side:#0a2a5e}
body.dark[class*="ev-"] .sidebar{background:#070b17}
.av svg,.avs svg,.avopt svg{width:80%;height:80%;display:block}
</style>
</head>
<body>

<div id="auth" class="auth hidden"></div>

<div class="app">
<aside class="sidebar">
  <div class="logo"><em>G</em><b>Grade<span>o</span></b></div>
  <button id="pip" class="pip hidden" onclick="pipTap()" aria-label="Pip the owl, tap for a tip">🦉</button><div id="pipb" class="pipb hidden" role="status"></div>
  <div class="nav" id="nav">
    <button data-v="home" onclick="go('home')"><span class="ic">🏠</span><span class="t">Home</span></button>
    <button data-v="subjects" onclick="go('subjects')"><span class="ic">📚</span><span class="t">Subjects</span></button>
    <button data-v="quiz" onclick="go('quiz')"><span class="ic">🧠</span><span class="t">Quiz</span></button>
    <button data-v="foryou" onclick="go('foryou')"><span class="ic">🎓</span><span class="t">For You</span></button>
    <button data-v="cards" onclick="go('cards')"><span class="ic">🗂️</span><span class="t">Flashcards</span></button>
    <button data-v="advice" onclick="go('advice')"><span class="ic">🎯</span><span class="t">Study Advice</span></button>
    <button data-v="timer" onclick="go('timer')"><span class="ic">⏱️</span><span class="t">Study Timer</span></button>
    <button data-v="methods" onclick="go('methods')"><span class="ic">💡</span><span class="t">Study Methods</span></button>
    <button data-v="planner" onclick="go('planner')"><span class="ic">📅</span><span class="t">Planner</span></button>
    <button data-v="leaderboard" onclick="go('leaderboard')"><span class="ic">🏅</span><span class="t">Leaderboard</span></button>
    <button data-v="awards" onclick="go('awards')"><span class="ic">🏆</span><span class="t">Awards</span></button>
    <button data-v="admin" id="navAdmin" class="hidden" onclick="go('admin')"><span class="ic">👑</span><span class="t">Admin Panel</span></button>
    <button data-v="settings" onclick="go('settings')"><span class="ic">⚙️</span><span class="t">Settings</span></button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="small">GCSE Study Dashboard</div>
      <h2 id="pageTitle">Home</h2>
    </div>
    <div class="row"><div class="av" id="avatarTop" onclick="go('settings')" title="Your profile"></div><button class="btn secondary" onclick="toggleTheme()">🌙 Theme</button></div>
  </div>
  <div id="banner"></div>
  <div id="content"></div>
</main>
</div>

<script>
/* ============================================================
   GLOBAL MODE (Firebase Realtime Database over plain fetch)
   Paste your database URL below. Example:
     const GLOBAL_DB="https://my-gradeo-default-rtdb.firebaseio.com";
   Setup: console.firebase.google.com > Create project > Build >
   Realtime Database > Create database > Rules tab > paste this > Publish:
   {"rules":{
     "scores":{".read":true,"$id":{".write":true,".validate":"newData.hasChildren(['n','xp']) && newData.child('n').isString() && newData.child('n').val().length <= 20 && newData.child('xp').isNumber() && newData.child('xp').val() >= 0 && newData.child('xp').val() < 10000000"}},
     "site":{".read":true,".write":true},
     "ctl":{".read":true,".write":true},
     "admins":{".read":true,".write":true}
   }}
   Leave it empty ("") to run exactly like the normal device-only version.
   ============================================================ */
const GLOBAL_DB="https://gradeo-97e5c-default-rtdb.europe-west1.firebasedatabase.app";
let GLB={rows:null,err:"",loading:false},GCTL={},GADM={},lbTab="global",gTimer=null,siteWrote=0;
const gUrl=p=>GLOBAL_DB.replace(/\/+$/,"")+p+".json";
const gRowOk=id=>/^[A-Za-z0-9_-]{1,40}$/.test(String(id));
async function gGet(p){const r=await fetch(gUrl(p),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
function gSend(method,p,body){if(!GLOBAL_DB)return Promise.resolve();return fetch(gUrl(p),{method:method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)}).catch(()=>{})}
function gId(k){
  k=k||currentUser;const users=getUsers(),u=users[k];if(!u)return"";
  if(!u.gid){u.gid="g"+Math.random().toString(36).slice(2,9)+Date.now().toString(36);setUsers(users)}

function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v)}
function pushGlobal(now){

    const u=getUsers()[currentUser];if(!u||u.banned||typeof state==="undefined"||!state)return Promise.resolve();

/* commands aimed at this player: XP gifts, resets, bans, admin status */
async function pollMine(){
  if(!GLOBAL_DB||!currentUser)return;
  const who=currentUser;
  try{
    const id=gId(who),[c,a]=await Promise.all([gGet("/ctl/"+id).catch(()=>null),gGet("/admins").catch(()=>null)]);
    if(currentUser!==who)return;
    if(a&&typeof a==="object"){GADM=a;refreshAdminNav()}
    if(c&&typeof c==="object")applyCtl(c);
  }catch(e){}
}
function applyCtl(c){
  if(!currentUser||currentUser===ADMIN_USER)return;
  if(c.ban===true){
    const users=getUsers();if(users[currentUser]){users[currentUser].banned=true;users[currentUser].admin=false;setUsers(users)}
    logout();setTimeout(()=>{try{amsg("This account has been banned by the creator.")}catch(e){}},50);return;
  }
  if(c.ban===false){const users=getUsers();if(users[currentUser]&&users[currentUser].banned){users[currentUser].banned=false;setUsers(users)}}
  if(c.reset&&store("gradeo_ctl_reset","")!==String(c.reset)){
    const gm=store("gradeo_gall","");
    try{userKeys(currentUser).forEach(x=>localStorage.removeItem(x))}catch(e){}
    save("gradeo_ctl_reset",String(c.reset));if(gm)save("gradeo_gall",gm);
    if(c.gift&&c.gift.id)save("gradeo_ctl_gift",String(c.gift.id));
    loadState();toast("An admin reset your progress.");pushGlobal();go("home");return;
  }
  if(c.gift&&c.gift.id&&store("gradeo_ctl_gift","")!==String(c.gift.id)){
    const n=Math.round(Number(c.gift.n))||0;save("gradeo_ctl_gift",String(c.gift.id));
    if(n){state.xp=Math.max(0,state.xp+n);persist();toast(n>0?"🎁 An admin gave you "+n+" XP!":"An admin removed "+Math.abs(n)+" XP.");if(n>0)burstFX()}
    render();
  }
}

/* Lockout: 5 wrong tries = locked for 24 hours */
const MAX_FAILS=5,LOCK_MS=24*60*60*1000;
function getLocks(){try{const o=JSON.parse(store("gradeo_lock","{}"));return(o&&typeof o==="object")?o:{}}catch(e){return{}}}
function setLocks(o){save("gradeo_lock",JSON.stringify(o));idbSet("gradeo_lock",JSON.stringify(o))}
function lockLeft(k){const l=getLocks()[k];return(l&&l.until>Date.now())?l.until-Date.now():0}
function lockText(ms){const h=Math.floor(ms/36e5),m=Math.ceil((ms%36e5)/6e4);return(h?h+"h ":"")+m+"m"}
function lockMsg(k){return"Too many failed tries. This account is locked for another "+lockText(lockLeft(k))+"."}
function recordFail(k){
  const o=getLocks();let l=o[k]||{n:0,until:0};
  if(l.until&&l.until<=Date.now())l={n:0,until:0};
  l.n=(l.n||0)+1;
  if(l.n>=MAX_FAILS){l.until=Date.now()+LOCK_MS;l.n=0}
  o[k]=l;setLocks(o);return l;
}
function clearFails(k){const o=getLocks();if(o[k]){delete o[k];setLocks(o)}}
/* Saved logins: ask the browser to keep storage, and keep a second copy in IndexedDB */
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open("gradeo_backup",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbSet(k,v){try{const db=await idbOpen();db.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch(e){}}
async function idbGet(k){try{const db=await idbOpen();return await new Promise(res=>{const r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}catch(e){return null}}
async function restoreBackup(){
  try{
    for(const k of["gradeo_users","gradeo_lock"]){
      if(!localStorage.getItem(k)){const v=await idbGet(k);if(v)localStorage.setItem(k,v)}
    }
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    const u=localStorage.getItem("gradeo_users");if(u)idbSet("gradeo_users",u);
  }catch(e){}
}
const SEC_QUESTIONS=["What was your first pet's name?","What street did you grow up on?","What is your favourite teacher's surname?","What was your first school called?","What is your favourite food?"];

const norm=s=>s.trim().toLowerCase();
async function hash(t){
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return "x"+h;
}

    ${showBox}<button class="btn" type="submit">Save new password</button> <button class="btn secondary" type="button" onclick="showAuth('login')">Cancel</button></form>`;

async function doSignup(){
  const name=document.getElementById("sU").value.trim();
  const pw=document.getElementById("sP").value;
  const q=document.getElementById("sQ").value;
  const ans=document.getElementById("sA").value;
  const key=norm(name);
  if(!/^[a-z0-9_.-]{3,20}$/.test(key))return amsg("Username must be 3–20 letters or numbers.");
  if(pw.length<6)return amsg("Password must be at least 6 characters.");
  if(!ans.trim())return amsg("Type an answer to your security question.");
  try{localStorage.setItem("gradeo_test","1");localStorage.removeItem("gradeo_test")}catch(e){return amsg("Your browser is blocking saving (private window or blocked storage). Open this file in a normal Chrome/Safari window and try again.")}
  const users=getUsers();
  if(users[key])return amsg("That username is taken. Try another.");
  if(key===ADMIN_USER&&!(pendingAdmin&&pendingAdmin.signup)){
    pendingAdmin={key:key,signup:{name:name,pw:pw,q:q,ans:ans}};return showAuth("admincheck");
  }
  await createAccount(name,key,pw,q,ans);
}
async function createAccount(name,key,pw,q,ans){
  const users=getUsers();
  const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
  users[key]={name:name,salt:salt,pass:await hash(salt+pw),q:q,a:await hash(salt+norm(ans)),avatar:""};
  setUsers(users);
  save("gradeo_session",key);
  pendingAdmin=null;
  login(key);
}
async function doLogin(){
  const key=norm(document.getElementById("aU").value).slice(0,40);
  const pw=document.getElementById("aP").value;
  if(lockLeft(key))return amsg(lockMsg(key));
  const u=getUsers()[key];
  if(!u||(await hash(u.salt+pw))!==u.pass){
    const l=recordFail(key);
    if(lockLeft(key))return amsg(lockMsg(key));
    return amsg("Wrong username or password. "+(MAX_FAILS-l.n)+" "+((MAX_FAILS-l.n)===1?"try":"tries")+" left before a 24 hour lock.");
  }
  if(u.banned&&key!==ADMIN_USER&&await stillBanned(key,u))return amsg("This account has been banned by the creator.");
  const rem=document.getElementById("aRem").checked;
  if(key===ADMIN_USER){pendingAdmin={key:key,rem:rem};return showAuth("admincheck")}
  clearFails(key);
  if(rem)save("gradeo_session",key);else save("gradeo_session","");
  login(key);
}
function doAdminCheck(){
  if(!pendingAdmin)return showAuth("login");
  const key=pendingAdmin.key;
  if(lockLeft(key))return amsg(lockMsg(key));
  const sq=t=>t.trim().toLowerCase().replace(/\s+/g," ");
  const ok=ADMIN_QA.every((x,i)=>sq(document.getElementById("ac"+i).value)===x[1]);
  if(!ok){
    const l=recordFail(key);
    if(lockLeft(key)){pendingAdmin=null;showAuth("login");return amsg(lockMsg(key))}
    return amsg("Those answers aren't right. "+(MAX_FAILS-l.n)+" "+((MAX_FAILS-l.n)===1?"try":"tries")+" left before a 24 hour lock.");
  }
  clearFails(key);
  if(pendingAdmin.signup){const g=pendingAdmin.signup;return createAccount(g.name,key,g.pw,g.q,g.ans)}
  if(pendingAdmin.rem)save("gradeo_session",key);else save("gradeo_session","");
  pendingAdmin=null;
  login(key);
}
function doForgot1(){
  const key=norm(document.getElementById("fU").value);
  if(!getUsers()[key])return amsg("We can't find that username.");
  authUser=key;showAuth("forgot2");
}
async function doForgot2(){
  const users=getUsers();const u=users[authUser];
  if(lockLeft(authUser))return amsg(lockMsg(authUser));
  const ans=document.getElementById("fA").value;
  const pw=document.getElementById("fP").value;
  if(pw.length<6)return amsg("New password must be at least 6 characters.");
  if((await hash(u.salt+norm(ans)))!==u.a){
    const l=recordFail(authUser);
    if(lockLeft(authUser))return amsg(lockMsg(authUser));
    return amsg("That answer doesn't match. "+(MAX_FAILS-l.n)+" "+((MAX_FAILS-l.n)===1?"try":"tries")+" left before a 24 hour lock.");
  }
  clearFails(authUser);
  u.pass=await hash(u.salt+pw);
  setUsers(users);
  showAuth("login");
  amsg("Password changed. Log in with your new password.",true);
}

let state={xp:0,streak:0,lastDay:"",quizzes:0,perfect:0,sessions:0,plan:"",weak:{},tasks:[],secs:[],cards:[],miss:[],diff:"normal",path:{},ctopics:{}};
function loadState(){state={
  xp:Number(store("gradeo_xp",0)),streak:Number(store("gradeo_streak",0)),lastDay:store("gradeo_lastday",""),
  quizzes:Number(store("gradeo_quizzes",0)),perfect:Number(store("gradeo_perfect",0)),
  sessions:Number(store("gradeo_sessions",0)),plan:store("gradeo_plan",""),weak:(()=>{try{return JSON.parse(store("gradeo_weak","{}"))||{}}catch(e){return{}}})(),
  tasks:(()=>{try{const v=JSON.parse(store("gradeo_tasks","[]"));return Array.isArray(v)?v:[]}catch(e){return[]}})(),
  secs:(()=>{try{const v=JSON.parse(store("gradeo_secs","[]"));return Array.isArray(v)?v:[]}catch(e){return[]}})(),
  cards:(()=>{try{const v=JSON.parse(store("gradeo_cards","[]"));return Array.isArray(v)?v:[]}catch(e){return[]}})(),
  miss:(()=>{try{const v=JSON.parse(store("gradeo_miss","[]"));return Array.isArray(v)?v:[]}catch(e){return[]}})(),

  path:(()=>{try{const v=JSON.parse(store("gradeo_path","{}"));return v&&typeof v==="object"?v:{}}catch(e){return{}}})()
};}
function persist(){
  pushGlobal();
  save("gradeo_xp",state.xp);save("gradeo_streak",state.streak);save("gradeo_lastday",state.lastDay);
  save("gradeo_quizzes",state.quizzes);save("gradeo_perfect",state.perfect);
  save("gradeo_sessions",state.sessions);save("gradeo_plan",state.plan);save("gradeo_weak",JSON.stringify(state.weak||{}));save("gradeo_tasks",JSON.stringify(state.tasks||[]));save("gradeo_secs",JSON.stringify(state.secs||[]));save("gradeo_cards",JSON.stringify(state.cards||[]));save("gradeo_miss",JSON.stringify(state.miss||[]));save("gradeo_diff",state.diff||"normal");save("gradeo_ctopics",JSON.stringify(state.ctopics||{}));save("gradeo_path",JSON.stringify(state.path||{}));
}
function addXP(n){
  const today=new Date().toDateString();
  if(state.lastDay!==today){
    const y=new Date();y.setDate(y.getDate()-1);
    state.streak=state.lastDay===y.toDateString()?state.streak+1:1;
    state.lastDay=today;
  }
  const before=level();
  const g=Math.max(0,Math.round(n*(site().boost||1)));
  state.xp+=g;persist();
  if(level()>before)setTimeout(()=>{toast("🎉 Level up! You're now level "+level());burstFX()},1800);
  return g;

let timerSeconds=25*60,timerRunning=false,timerInterval=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function paintTimer(){const e=document.getElementById("tm");if(e)e.textContent=fmt(timerSeconds);document.title=timerRunning?fmt(timerSeconds)+" · Gradeo":"Gradeo — GCSE Study"}
function toggleTimer(){
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;render();return}
  timerRunning=true;
  const endAt=Date.now()+timerSeconds*1000;
  timerInterval=setInterval(()=>{
    timerSeconds=Math.max(0,Math.ceil((endAt-Date.now())/1000));paintTimer();
    if(timerSeconds<=0){
      clearInterval(timerInterval);timerRunning=false;timerSeconds=timerLen;
      if(timerXP>0){state.sessions++;const g=addXP(timerXP);toast("Session complete! +"+g+" XP");burstFX()}else toast("Break over. Back to it!");
      document.title="Gradeo — GCSE Study";render();
    }
  },1000);
  render();
}
function resetTimer(){clearInterval(timerInterval);timerRunning=false;timerSeconds=timerLen;document.title="Gradeo — GCSE Study";render()}

function prep(q,sub){return diffWrap(prep0(q,sub))}
function prep0(q,sub){
  const idx=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);
  return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),sid:sub.id,sn:sub.name,saved:false});
}
function newQuiz(list,label,again,max){
  return{s:label,i:0,score:0,picked:null,missed:[],qs:list.sort(()=>Math.random()-.5).slice(0,max||15),again:again,hard:state.diff==="hard",xpq:{easy:5,normal:10,hard:15}[state.diff||"normal"]};
}
function startQuiz(id,ti){
  const sub=SUBJECTS.find(x=>x.id===id);if(!sub)return;
  const topic=(ti===undefined||ti===null)?null:sub.topics[ti];
  PATHL=3;
  quiz=newQuiz(buildTest(sub,15,topic),{id:sub.id,name:topic?sub.name+" · "+topic:sub.name},{kind:"subject",id:id,ti:ti},15);
  go("quiz");
}
function startMixed(){
  const pool=[];SUBJECTS.forEach(sub=>sub.qs.concat(pairQs(sub)).forEach(q=>pool.push(prep(q,sub))));
  quiz=newQuiz(pool,{id:"mixed",name:"Mixed challenge"},{kind:"mixed"},20);go("quiz");
}
function startMistakes(){
  const pool=(state.miss||[]).map(m=>{const sub=SUBJECTS.find(x=>x.id===m.s);const q=sub&&sub.qs.find(x=>x.q===m.q);return q?prep(q,sub):null}).filter(Boolean);
  if(!pool.length)return toast("No mistakes to fix yet. Take a quiz first!");
  quiz=newQuiz(pool,{id:"miss",name:"Fix my mistakes"},{kind:"miss"});go("quiz");
}
function replayQuiz(){
  const a=quiz&&quiz.again;if(!a)return go("quiz");
  if(a.kind==="mixed")startMixed();else if(a.kind==="miss")startMistakes();else if(a.kind==="path")startPath(a.id);else startQuiz(a.id,a.ti);
}
function trackMiss(q,ok){
  state.miss=state.miss||[];
  const i=state.miss.findIndex(m=>m.s===q.sid&&m.q===q.q);
  if(!ok&&i<0){state.miss.push({s:q.sid,q:q.q});if(state.miss.length>60)state.miss.shift()}
  if(ok&&i>=0)state.miss.splice(i,1);
  persist();
}
function pick(n){
  if(quiz.picked!==null)return;
  quiz.picked=n;
  const q=quiz.qs[quiz.i],ok=n===q.a;
  if(ok)quiz.score++;
  quiz.lastXP=ok?addXP(quiz.xpq||10):0;quiz.earned=(quiz.earned||0)+quiz.lastXP;
  recordTopic(q.sid,q.t,ok);
  trackMiss(q,ok);
  if(!ok&&q.t&&!quiz.missed.some(m=>m.sid===q.sid&&m.t===q.t))quiz.missed.push({sid:q.sid,sn:q.sn,t:q.t});
  if(quiz.i>=quiz.qs.length-1)finishQuiz();
  render();
}
function finishQuiz(){
  if(quiz.done)return;quiz.done=true;
  state.quizzes++;
  if(quiz.score===quiz.qs.length)state.perfect++;
  if(quiz.again&&quiz.again.kind==="path")finishPath();
  persist();
}
function explainHTML(q,ok){
  return `<div class="explain ${ok?"good":"bad"}"><b>${ok?"✅ Correct!":"❌ Not quite."}</b>${ok&&quiz.lastXP?` <b style="color:#13894a">+${quiz.lastXP} XP</b>`:""}${ok?"":` The answer is <b>${escapeHTML(q.o[q.a])}</b>.`}${q.e?`<p>${escapeHTML(q.e)}</p>`:""}
  <div class="small">Topic: ${escapeHTML(q.t||"General")}</div>
  <div class="lnks" style="margin-top:10px">${ok?"":helpLinks(q.sn,q.t||"")}${q.saved?`<span class="lnk">✓ Saved</span>`:`<button class="lnk" onclick="cardFromQ()">🗂️ Save as flashcard</button>`}</div></div>`;
}
function cardFromQ(){

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysUntil(due){
  if(!due)return null;
  const p=due.split("-").map(Number);if(p.length!==3||p.some(isNaN))return null;
  const a=new Date(p[0],p[1]-1,p[2]),n=new Date();n.setHours(0,0,0,0);
  return Math.round((a-n)/864e5);
}
function dueLabel(t){
  const d=daysUntil(t.due);if(d===null)return"";
  if(t.done)return"📅 "+t.due;
  if(d<0)return"⚠️ Overdue by "+(-d)+(d===-1?" day":" days");
  if(d===0)return"🔥 Due today";
  if(d===1)return"⏰ Due tomorrow";
  if(d<=7)return"📅 Due in "+d+" days";
  return"📅 "+t.due;
}
function dueClass(t){const d=daysUntil(t.due);if(t.done||d===null)return"";return d<0?"over":d<=1?"soon":""}
function sortTasks(a,b){
  if(a.done!==b.done)return a.done?1:-1;
  const da=a.due||"9999",db=b.due||"9999";
  if(da!==db)return da<db?-1:1;
  const o={high:0,med:1,low:2};return(o[a.pri]||1)-(o[b.pri]||1);
}

  return h;
}

    const learn=sub?ctOf(sub.id).concat(sub.topics).filter(tp=>!weak.some(w=>w.t===tp)).slice(0,5):[];
    h+=`<div class="card struggle"><h3>${sub?sub.icon+" ":""}${escapeHTML(t.title)}</h3><p class="small">${d===0?"Today":d===1?"Tomorrow":"In "+d+" days"} · ${pl[0]} · about <b>${mins} minutes a day</b></p>
    <p><b>What to do</b></p>${pl[1].map(x=>`<div class="tip">${x}</div>`).join("")}
    ${weak.length?`<p><b>Your weak topics</b></p>${weak.slice(0,4).map(w=>helpRow(w.s.name,w.t,w.w+" missed")).join("")}`:""}
    ${sub&&learn.length?`<p><b>${weak.length?"Also cover":"Lessons to cover"}</b></p>${learn.map(tp=>helpRow(sub.name,tp,"lesson")).join("")}`:""}
    ${sub?`<div class="row" style="margin-top:12px"><button class="btn" onclick="startQuiz('${sub.id}')">Quiz me</button><button class="btn secondary" onclick="go('tests','${sub.id}')">Test path</button><button class="btn secondary" onclick="go('cards')">Flashcards</button></div>`:`<p class="small">Pick a subject on this task in the Planner to get topic lessons and links.</p>`}</div>`;
  });
  const wk=weakTopics().slice(0,3);
  if(wk.length)h+=struggleCard(wk.map(x=>helpRow(x.s.name,x.t,x.w+" missed")),"Based on your quizzes","These are the topics to work on next.");
  return h;
}

/* A short burst of falling emoji (about 6 seconds), then it clears away. It never blocks clicks. */
function burstFX(force){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ev=EVENTS[evKey()];if(!ev)return;
  let fx=document.getElementById("evfx");
  if(!fx){fx=document.createElement("div");fx.id="evfx";fx.setAttribute("aria-hidden","true");document.body.appendChild(fx)}
  fx.innerHTML="";
  for(let i=0;i<30;i++){
    const sp=document.createElement("span");
    sp.textContent=ev.fx[i%ev.fx.length];
    sp.style.left=(Math.random()*100)+"%";
    sp.style.fontSize=(16+Math.random()*18)+"px";
    sp.style.animationDuration=(3+Math.random()*2.5)+"s";
    sp.style.animationDelay=(Math.random()*1.5)+"s";
    fx.appendChild(sp);
  }

}

function fxRun(list,crows){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  let fx=document.getElementById("evfx");if(!fx){fx=document.createElement("div");fx.id="evfx";fx.setAttribute("aria-hidden","true");document.body.appendChild(fx)}
  fx.innerHTML="";
  for(let i=0;i<30;i++){const sp=document.createElement("span");sp.textContent=list[i%list.length];sp.style.left=Math.random()*100+"%";sp.style.fontSize=(16+Math.random()*18)+"px";sp.style.animationDuration=(3+Math.random()*2.5)+"s";sp.style.animationDelay=Math.random()*1.5+"s";fx.appendChild(sp)}
  if(crows)crowFlock(fx);
  clearTimeout(fx._t);fx._t=setTimeout(()=>{fx.innerHTML=""},crows?15000:7500);
}

/* ---- apply everything the admins set (runs on every device) ---- */
function applyFlags(){
  const s=site(),f=(s.fl&&typeof s.fl==="object")?s.fl:{};
  let css=Object.keys(f).filter(k=>f[k]===true&&FL[k]).map(k=>FL[k][1]).join("\n");
  css+="\n"+String(s.css||"").slice(0,6000).replace(/@import|url\s*\(|expression\s*\(|<\/?style|javascript:/gi,"");
  let st=document.getElementById("flcss");if(!st){st=document.createElement("style");st.id="flcss";document.head.appendChild(st)}
  if(st.textContent!==css)st.textContent=css;
  if(!currentUser)return;
  if(s.fx&&s.fx.id&&store("gradeo_fx","")!==String(s.fx.id)){save("gradeo_fx",String(s.fx.id));if(Date.now()-(Number(s.fx.t)||0)<12e4&&FXS[s.fx.k])fxRun(FXS[s.fx.k],s.fx.k==="crows")}
  if(s.rl&&store("gradeo_rl","")!==String(s.rl)){save("gradeo_rl",String(s.rl));if(Date.now()-(Number(s.rl)||0)<6e5)setTimeout(()=>location.reload(),800)}

}

/* ---- signed JavaScript updates (only run if signed with your key) ---- */
const enc=new TextEncoder(),b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),u2b=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function runSigned(j){
  window._jsRan=j.id;
  try{
    if(!UPDATE_KEY)return;
    const k=await crypto.subtle.importKey("jwk",JSON.parse(UPDATE_KEY),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    if(await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,b2u(j.sig),enc.encode(j.code)))new Function(j.code)();
  }catch(e){}
}
async function updKey(){
  if(!creatorOnly())return;
  if(localStorage.getItem("gradeo_sigkey")&&!confirm("A signing key already exists on this device. Make a new one? Old signed updates stop working."))return;
  const kp=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
  localStorage.setItem("gradeo_sigkey",JSON.stringify(await crypto.subtle.exportKey("jwk",kp.privateKey)));
  prompt("Copy this, paste it between the quotes of UPDATE_KEY in the code, then re-upload the file. Keep this device: the private key lives here.",JSON.stringify(await crypto.subtle.exportKey("jwk",kp.publicKey)));
}
function updCSS(){if(!creatorOnly())return;setSite({css:document.getElementById("updCss").value.slice(0,6000)});toast("CSS published to everyone.")}
async function updJS(publish){
  if(!creatorOnly())return;
  const code=document.getElementById("updJs").value;
  if(!publish){try{new Function(code)();toast("Ran on this device only.")}catch(e){toast("Error: "+e.message)}return}
  if(!code.trim()){setSite({js:null});return toast("JS update cleared.")}
  try{new Function(code)}catch(e){return toast("Syntax error: "+e.message)}
  const raw=localStorage.getItem("gradeo_sigkey");if(!raw)return toast("Create a signing key first.");
  if(!UPDATE_KEY)return toast("Paste your public key into UPDATE_KEY first.");
  const k=await crypto.subtle.importKey("jwk",JSON.parse(raw),{name:"ECDSA",namedCurve:"P-256"},false,["sign"]);
  const sig=u2b(await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},k,enc.encode(code)));
  setSite({js:{id:String(Date.now()),code:code,sig:sig}});toast("JS update published to everyone.");
}
function updHTML(){
  if(!isCreator())return"";const s=site();
  return `<div class="card"><h3>🛠️ Update area</h3><p class="small">Small live updates for everyone, no re-upload needed. <b>CSS</b> changes the look. <b>JavaScript</b> changes behaviour, but only runs on a device if it is signed with your key, so nobody else can push code. JS runs again on each page load, so keep it safe to repeat.</p>
  <p class="small" style="margin:10px 0 6px"><b>CSS</b></p><textarea id="updCss" rows="5" placeholder=".card{border-radius:8px}">${escapeHTML(s.css||"")}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="updCSS()">Publish CSS</button><button class="btn secondary" onclick="document.getElementById('updCss').value='';updCSS()">Clear</button></div>
  <p class="small" style="margin:14px 0 6px"><b>JavaScript</b> ${UPDATE_KEY?"":"(needs UPDATE_KEY, see the comment in the code)"}</p><textarea id="updJs" rows="6" placeholder="toast('Hello everyone!')">${escapeHTML((s.js&&s.js.code)||"")}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn secondary" onclick="updJS(false)">▶ Test here only</button><button class="btn" onclick="updJS(true)">Publish JS</button><button class="btn secondary" onclick="updKey()">🔑 Create signing key</button></div></div>`;
}

/* ---- command registry ---- */
const CMDS=[];

function xpAll(n){setSite({gall:{id:String(Date.now()),n:n,t:Date.now()}});applyGall();toast("Gave everyone "+n+" XP.")}
function cmdTarget(n){
  n=(n||"").replace(/^@/,"").toLowerCase();if(!n)return null;
  const rows=GLB.rows||[],ex=rows.filter(x=>x.u.name.toLowerCase()===n),p=ex.length?ex:rows.filter(x=>x.u.name.toLowerCase().startsWith(n));
  if(p.length!==1){toast(p.length?"Several players match, be more specific.":"No player called "+n+". Tap Refresh in Global players first.");return null}
  return p[0];
}

C("help","How commands work",()=>alert("Press / or Ctrl+K anywhere, or tap the ⌨️ button, to search commands.\nOr type /name in the Admin Panel console.\nExamples:\n/confetti\n/xp50\n/give @sam 50\n/dm @sam well done!\n/qotd What is 7x8? | 56\n/countdown Maths 2026-11-05\n\n"+CMDS.length+" commands in total."));

C("qotd","Question of the day",a=>{const t=a.join(" ").split("|");if(t.length<2||!t[1].trim())return toast("Use /qotd question | answer");setSite({q:{id:String(Date.now()),q:t[0].trim().slice(0,200),a:t[1].trim().slice(0,60)}});toast("Question posted.")},"question | answer");

C("count","How many global players",()=>toast((GLB.rows||[]).length+" global players"));

C("dm","Private message to one player",a=>{const t=T(a,1);if(!t)return;const x=a.slice(1).join(" ").slice(0,300);if(!x)return toast("Use /dm @name message");gSend("PATCH","/ctl/"+t.id,{dm:{id:String(Date.now()),t:x}}).then(()=>toast("Sent to "+t.u.name+"."))},"@name text");
C("kick","Log one player out (they can log back in)",a=>{const t=T(a,1);if(!t)return;gSend("PATCH","/ctl/"+t.id,{kick:String(Date.now())}).then(()=>toast(t.u.name+" will be logged out."))},"@name");

C("demote","Remove a player's admin (creator only)",a=>{const t=T(a);if(t)gAdminMake(t.id,false)},"@name");

function runCmd(raw){
  if(!adminOnly())return;
  const p=String(raw||"").trim().replace(/^\//,"").split(/\s+/),n=(p.shift()||"").toLowerCase(),c=CMDS.find(x=>x.n===n);
  if(!c)return toast("Unknown command. Try /help");
  addRecent("/"+n+(p.length?" "+p.join(" "):""));
  try{c.f(p)}catch(e){toast("Command failed: "+e.message)}
  if(view==="admin")render();
}
function cmdHTML(){
  return `<div class="card"><h3>⌨️ Command console</h3><p class="small">${CMDS.length} commands. Type one and press Enter, e.g. <b>/confetti</b>, <b>/xp50</b>, <b>/dm @sam hello</b>. Look, effect, XP and announcement commands reach everyone.</p>
  <div class="row"><input id="cmdIn" placeholder="/help" autocapitalize="off" autocomplete="off" onkeydown="if(event.key==='Enter')runCmd(this.value)"><button class="btn" onclick="runCmd(document.getElementById('cmdIn').value)">Run</button></div>${recents().length?`<div class="chips" style="margin-top:10px">${recents().map((r,i)=>`<button class="chip" onclick="runCmd(recents()[${i}])">🕘 ${escapeHTML(r)}</button>`).join("")}</div>`:""}
  <details style="margin-top:12px"><summary><b>All ${CMDS.length} commands</b></summary>${CMDS.map(c=>`<div class="adm-row"><button class="btn secondary sm" onclick="${c.a?`var i=document.getElementById('cmdIn');i.value='/${c.n} ';i.focus()`:`runCmd('${c.n}')`}">/${c.n}</button><span class="small grow">${escapeHTML(c.d)}${c.a?" · "+escapeHTML(c.a):""}</span></div>`).join("")}</details></div>`;
}
/* ---- quick command palette: ⌨️ button on every page, "/" or Ctrl+K ---- */
const RK="gradeo_recent_cmds";
function recents(){try{const v=JSON.parse(localStorage.getItem(RK)||"[]");return Array.isArray(v)?v.filter(x=>typeof x==="string").slice(0,8):[]}catch(e){return[]}}
function addRecent(raw){raw=String(raw).trim().slice(0,200);if(!raw)return;try{localStorage.setItem(RK,JSON.stringify([raw].concat(recents().filter(x=>x!==raw)).slice(0,8)))}catch(e){}}
let palSel=0,palCur=[];
function palRows(){
  const q=document.getElementById("palIn").value.trim().replace(/^\//,"").toLowerCase().split(/\s+/)[0];
  if(!q)return recents().map(x=>({raw:x})).concat(CMDS.slice(0,40).map(c=>({c:c})));
  return CMDS.filter(c=>c.n.includes(q)||c.d.toLowerCase().includes(q)).sort((a,b)=>(b.n.startsWith(q)-a.n.startsWith(q))||(a.n.length-b.n.length)).slice(0,40).map(c=>({c:c}));
}
function palDraw(){
  palCur=palRows();
  document.getElementById("palList").innerHTML=palCur.map((r,i)=>`<button class="palRow ${i===palSel?"sel":""}" onclick="palPickI(${i})">`+(r.raw?`<b>🕘 ${escapeHTML(r.raw)}</b>`:`<b>/${r.c.n}</b><span>${escapeHTML(r.c.d)}${r.c.a?" · "+escapeHTML(r.c.a):""}</span>`)+`</button>`).join("")||'<p class="small">No match.</p>';
  const s=document.querySelector("#palList .sel");if(s&&s.scrollIntoView)s.scrollIntoView({block:"nearest"});
}
function palOpen(){if(!(currentUser&&isAdmin()))return;const i=document.getElementById("palIn");document.getElementById("pal").classList.add("on");i.value="";palSel=0;palDraw();setTimeout(()=>i.focus(),30)}
function palClose(){document.getElementById("pal").classList.remove("on")}
function palPick(r){
  if(!r)return;const i=document.getElementById("palIn");
  if(r.raw){palClose();runCmd(r.raw)}
  else if(r.c.a){i.value="/"+r.c.n+" ";i.focus();palDraw()}
  else{palClose();runCmd(r.c.n)}
}
function palPickI(i){palPick(palCur[i])}
function palBtn(){const b=document.getElementById("palBtn");if(b)b.style.display=(currentUser&&isAdmin()&&!(view==="quiz"&&quiz))?"block":"none"}
(function(){
  const st=document.createElement("style");
  st.textContent="#palBtn{position:fixed;right:16px;bottom:16px;z-index:9000;width:52px;height:52px;border-radius:50%;font-size:24px;background:var(--blue);color:#fff;border:2px solid var(--line);box-shadow:3px 3px 0 var(--sh)}#pal{position:fixed;inset:0;z-index:10000;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:8vh 12px 0}#pal.on{display:flex}#palBox{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--sh);width:100%;max-width:560px;max-height:80vh;display:flex;flex-direction:column;padding:14px}#palList{overflow:auto;margin-top:10px}.palRow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:transparent;color:var(--ink)}.palRow.sel,.palRow:hover{background:var(--soft)}.palRow b{white-space:nowrap}.palRow span{font-size:13px;color:var(--muted)}";
  document.head.appendChild(st);
  const d=document.createElement("div");d.id="pal";
  d.innerHTML='<div id="palBox"><input id="palIn" placeholder="Type a command (try: conf, xp, give)" autocomplete="off" autocapitalize="off"><div id="palList"></div></div>';
  document.body.appendChild(d);
  d.addEventListener("click",e=>{if(e.target===d)palClose()});
  const b=document.createElement("button");b.id="palBtn";b.textContent="⌨️";b.setAttribute("aria-label","Open admin commands");b.onclick=palOpen;b.style.display="none";document.body.appendChild(b);
  const inp=d.querySelector("#palIn");
  inp.addEventListener("input",()=>{palSel=0;palDraw()});
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palSel+1,palCur.length-1);palDraw()}
    else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(palSel-1,0);palDraw()}
    else if(e.key==="Enter"){e.preventDefault();const v=inp.value.trim();palPick(v.includes(" ")?{raw:v}:palCur[palSel])}
    else if(e.key==="Escape")palClose();
  });
  document.addEventListener("keydown",e=>{
    if(!(currentUser&&isAdmin()))return;
    const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
    if((e.key==="k"&&(e.ctrlKey||e.metaKey))||(e.key==="/"&&!typing)){e.preventDefault();palOpen()}
    else if(e.key==="Escape")palClose();
  });
  setInterval(palBtn,1500);
})();
applyFlags();setTimeout(applyFlags,600);palBtn();
